[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lablinks-poc"
version = "0.1.0"
description = "Reference LabLinks proof-of-concept for cross-lab claim coordination."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.111,<1.0",
  "httpx>=0.27,<1.0",
  "pydantic>=2.7,<3.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
  "integration: slow smoke tests that require Docker and live services",
]

[tool.setuptools.packages.find]
include = ["directory*", "lab_a_node*", "lab_b_node*", "lablinks_poc*", "sdk*"]

